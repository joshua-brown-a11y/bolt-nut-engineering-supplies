#  Mweb SMTP Configuration (SSL/TLS Preferred)
spring.mail.host=smtp.mweb.co.za
spring.mail.port=465
spring.mail.username=mwboltne@mweb.co.za
spring.mail.password=5024stre
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.enable=true

# Critical: This ensures the app trusts Mweb's specific security certificate
spring.mail.properties.mail.smtp.ssl.trust=smtp.mweb.co.za

# Timeouts to prevent the app from hanging if the Mweb server is slow
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

